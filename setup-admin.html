<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Setup Admin SIMARSIP</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f0f4f8; }
  .box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); max-width: 420px; width: 100%; text-align: center; }
  h2 { color: #0b2239; margin-bottom: 8px; }
  p { color: #555; font-size: 0.9rem; margin-bottom: 24px; }
  .status { padding: 16px; border-radius: 8px; margin-top: 20px; font-weight: 600; font-size: 1rem; display: none; }
  .success { background: #dcfce7; color: #16a34a; display: block; }
  .error { background: #fee2e2; color: #dc2626; display: block; }
  .info { background: #dbeafe; color: #1d4ed8; display: block; }
  button { background: #2563eb; color: #fff; border: none; padding: 14px 32px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .field { text-align: left; margin-bottom: 16px; }
  label { font-size: 0.85rem; color: #555; display: block; margin-bottom: 4px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="box">
  <h2>🔧 Setup Admin SIMARSIP</h2>
  <p>Halaman ini untuk membuat atau mereset akun Admin Utama SIMARSIP AAS.</p>
  
  <div class="field">
    <label>Email Admin</label>
    <input type="email" id="adminEmail" value="adminpendidikanaas.operator@gmail.com" readonly style="background:#f8fafc; color:#64748b;">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="adminPass" placeholder="Masukkan password admin" value="B@gus18081992">
  </div>
  <div class="field">
    <label>Nama Admin</label>
    <input type="text" id="adminName" value="R. Bagus Sasutya, A.Md.Akup">
  </div>
  
  <button id="btnSetup" onclick="setupAdmin()">🚀 Buat / Reset Akun Admin</button>
  
  <div id="statusMsg" class="status"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCdOtyCix06Cty82u7ls1YT-WhKcUMpjIo",
  authDomain: "arsip-aas.firebaseapp.com",
  projectId: "arsip-aas",
  storageBucket: "arsip-aas.firebasestorage.app",
  messagingSenderId: "958092839381",
  appId: "1:958092839381:web:ba6936a7a4fccc11bfd55c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.className = 'status ' + type;
  el.innerHTML = msg;
}

async function setupAdmin() {
  const email = 'adminpendidikanaas.operator@gmail.com';
  const pass = document.getElementById('adminPass').value;
  const name = document.getElementById('adminName').value;
  const btn = document.getElementById('btnSetup');
  
  if (!pass || pass.length < 6) {
    setStatus('❌ Password minimal 6 karakter!', 'error');
    return;
  }
  
  btn.disabled = true;
  btn.textContent = '⏳ Memproses...';
  setStatus('Sedang menghubungkan ke Firebase...', 'info');
  
  try {
    // Try to sign in first
    setStatus('Mencoba login dengan akun yang ada...', 'info');
    const cred = await auth.signInWithEmailAndPassword(email, pass);
    
    // Already exists, just update/create Firestore doc
    setStatus('Akun sudah ada! Memperbarui data Firestore...', 'info');
    await db.collection('users').doc(cred.user.uid).set({
      email: email,
      name: name,
      role: 'admin',
      bidang: [],
      status: 'active',
      createdAt: new Date().toISOString()
    }, { merge: true });
    
    await auth.signOut();
    setStatus('✅ BERHASIL! Akun admin sudah aktif dan data Firestore diperbarui.<br><br>Silakan kembali ke <a href="https://arsip.akademiakupunktursurabaya.web.id/" target="_blank">SIMARSIP</a> dan login!', 'success');
    
  } catch(e) {
    if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential') {
      // Account doesn't exist, create it
      setStatus('Akun belum ada. Membuat akun baru...', 'info');
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(cred.user.uid).set({
          email: email,
          name: name,
          role: 'admin',
          bidang: [],
          status: 'active',
          createdAt: new Date().toISOString()
        });
        await auth.signOut();
        setStatus('✅ BERHASIL! Akun admin baru berhasil dibuat.<br><br>Silakan kembali ke <a href="https://arsip.akademiakupunktursurabaya.web.id/" target="_blank">SIMARSIP</a> dan login!', 'success');
      } catch(createErr) {
        setStatus('❌ Gagal membuat akun: <b>' + createErr.code + '</b><br>' + createErr.message, 'error');
      }
    } else if (e.code === 'auth/wrong-password') {
      setStatus('❌ Password salah! Akun sudah ada tapi password tidak cocok.<br>Coba ganti password di kolom di atas.', 'error');
    } else {
      setStatus('❌ Error: <b>' + e.code + '</b><br>' + e.message, 'error');
    }
  }
  
  btn.disabled = false;
  btn.textContent = '🚀 Buat / Reset Akun Admin';
}
</script>
</body>
</html>
