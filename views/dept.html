<main class="page hidden" id="page-dept">
    <div class="dept-banner" id="deptBanner">
      <div class="dept-banner-icon" id="deptBannerIcon"></div>
      <div>
        <h2 id="deptBannerName">Bidang</h2>
        <p id="deptBannerSub">Manajemen arsip</p>
      </div>
    </div>
    <div id="deptArsipCharts">
      <div class="stat-row" id="deptStatRow"></div>
      <div class="grid-2-1">
        <div class="panel">
          <div class="panel-hd"><h3><i class="fas fa-chart-bar"></i> Tingkat Kerja Bulanan</h3><span class="panel-sub" id="deptChartSub"></span></div>
          <div class="chart-wrap"><canvas id="chartDeptBar"></canvas></div>
        </div>
        <div class="panel">
          <div class="panel-hd"><h3><i class="fas fa-circle-half-stroke"></i> Status Arsip</h3></div>
          <div class="chart-wrap chart-center"><canvas id="chartDeptDonut"></canvas></div>
        </div>
      </div>
    </div>

    <div id="mhsChartContainer" style="display:none;" class="grid-1-1">
      <div class="panel">
        <div class="panel-hd"><h3><i class="fas fa-chart-bar"></i> Tren Mahasiswa (5 Tahun Terakhir)</h3></div>
        <div class="chart-wrap"><canvas id="mhsTrendChart"></canvas></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><h3><i class="fas fa-chart-pie"></i> Komposisi Status Mahasiswa</h3></div>
        <div class="chart-wrap chart-center"><canvas id="mhsStatusChart"></canvas></div>
      </div>
    </div>

    <!-- Arsip Table -->
    <div id="deptTableContainer" class="table-card">
      <div class="table-top-row">
        <h3 id="deptTableTitle">Daftar Arsip</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="deptFilterJenis" onchange="renderDeptTable()" style="background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r3);color:var(--t1);font-size:.8rem;padding:7px 10px;outline:none">
            <option value="">Semua Jenis</option>
          </select>
          <div class="search-field" style="max-width:250px">
            <i class="fas fa-search"></i>
            <input type="text" id="deptSearch" placeholder="Cari arsip bidang ini..." oninput="renderDeptTable()" />
          </div>
        </div>
      </div>
      <table class="data-table">
        <thead id="deptHead"></thead>
        <tbody id="deptBody"></tbody>
      </table>
      <div class="empty-state hidden" id="deptEmpty">
        <i class="fas fa-inbox"></i>
        <p>Belum ada arsip untuk bidang ini pada tahun akademik ini</p>
      </div>
      <div class="table-foot" id="deptInfo"></div>
    </div>

    <!-- Mahasiswa Table -->
    <div id="deptMhsContainer" style="display:none;">
      <div class="filter-strip" style="margin-bottom:16px">
        <div class="search-field">
          <i class="fas fa-search"></i>
          <input type="text" id="mhsSearch" placeholder="Cari nama, NIM, angkatan..." oninput="renderMahasiswaPage()" />
        </div>
        <select id="mhsFilterAy" onchange="renderMahasiswaPage()">
          <option value="">Semua Tahun Akademik</option>
        </select>
        <select id="mhsFilterStatus" onchange="renderMahasiswaPage()">
          <option value="">Semua Status</option>
          <option value="aktif">Aktif</option>
          <option value="cuti">Cuti</option>
          <option value="lulus">Lulus</option>
          <option value="keluar">Mengundurkan Diri / Keluar</option>
        </select>
        <button class="tb-btn tb-btn-primary" style="margin-left:auto" onclick="openMhsForm()"><i class="fas fa-plus"></i> Tambah Mahasiswa</button>
      </div>
      <div class="grid-profile" id="mhsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px"></div>
      <div class="empty-state hidden" id="mhsEmpty"><i class="fas fa-users-slash"></i><p>Tidak ada data mahasiswa ditemukan</p></div>
    </div>

    <!-- SDM Grid -->
    <div id="deptSdmContainer" style="display:none;">
      <div class="filter-strip" style="margin-bottom:16px">
        <div class="search-field">
          <i class="fas fa-search"></i>
          <input type="text" id="sdmSearch" placeholder="Cari nama, NIDN/NIK, jabatan..." oninput="renderSdmPage()" />
        </div>
        <select id="sdmFilterAy" onchange="renderSdmPage()">
          <option value="">Semua Tahun Akademik</option>
        </select>
        <select id="sdmFilterStatus" onchange="renderSdmPage()">
          <option value="">Semua Status</option>
          <option value="aktif">Aktif</option>
          <option value="tugas_belajar">Tugas Belajar</option>
          <option value="pensiun">Pensiun</option>
          <option value="keluar">Berhenti / Keluar</option>
        </select>
        <button class="tb-btn tb-btn-primary" style="margin-left:auto" onclick="openSdmForm()"><i class="fas fa-plus"></i> Tambah SDM</button>
      </div>
      <div class="grid-profile" id="sdmGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px"></div>
      <div class="empty-state hidden" id="sdmEmpty"><i class="fas fa-users-slash"></i><p>Tidak ada data SDM ditemukan</p></div>
    </div>
  </main>
